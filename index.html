<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Super Easy</title>
    <!-- Tailwind CSS untuk UI/UX Responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF-Lib untuk manipulasi PDF -->
    <script src="https://unpkg.com/pdf-lib"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold"><i class="fa-solid fa-file-pdf mr-2"></i>PDF Super Easy</h1>
        <p class="text-sm opacity-80 mt-1">Edit, Sign, & Convert langsung dari browser Anda</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
        
        <!-- Upload Area -->
        <div class="w-full max-w-2xl bg-white border-2 border-dashed border-blue-300 rounded-xl p-8 text-center hover:bg-blue-50 transition duration-300 cursor-pointer mb-6" id="dropzone" onclick="document.getElementById('file-upload').click()">
            <i class="fa-solid fa-cloud-arrow-up text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-xl font-semibold mb-2">Upload File Anda</h2>
            <p class="text-gray-500 text-sm mb-4">Pilih file PDF atau Gambar (JPG/PNG) dari perangkat Anda</p>
            <input type="file" id="file-upload" class="hidden" accept="image/png, image/jpeg, .pdf" />
            <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Pilih File</button>
            <p id="file-name" class="mt-4 text-sm font-semibold text-green-600 hidden"></p>
        </div>

        <!-- Menu Action -->
        <div id="action-menu" class="w-full max-w-2xl grid grid-cols-1 md:grid-cols-3 gap-4 hidden">
            <!-- Tombol Sign -->
            <button onclick="startSignProcess()" class="bg-white p-4 rounded-xl shadow border border-gray-200 hover:border-blue-500 hover:shadow-md transition flex flex-col items-center justify-center text-center group">
                <div class="bg-green-100 p-3 rounded-full mb-3 group-hover:bg-green-200 transition">
                    <i class="fa-solid fa-signature text-green-600 text-xl"></i>
                </div>
                <h3 class="font-semibold">Tanda Tangan</h3>
                <p class="text-xs text-gray-500 mt-1">Bubuhi tanda tangan digital</p>
            </button>

            <!-- Tombol Edit/Modif -->
            <button class="bg-white p-4 rounded-xl shadow border border-gray-200 hover:border-blue-500 hover:shadow-md transition flex flex-col items-center justify-center text-center group opacity-50 cursor-not-allowed" title="Fitur menyusul">
                <div class="bg-purple-100 p-3 rounded-full mb-3">
                    <i class="fa-solid fa-object-ungroup text-purple-600 text-xl"></i>
                </div>
                <h3 class="font-semibold">Modifikasi</h3>
                <p class="text-xs text-gray-500 mt-1">Hapus/Gabung halaman</p>
            </button>

            <!-- Tombol Convert -->
            <button class="bg-white p-4 rounded-xl shadow border border-gray-200 hover:border-blue-500 hover:shadow-md transition flex flex-col items-center justify-center text-center group opacity-50 cursor-not-allowed" title="Fitur menyusul">
                <div class="bg-orange-100 p-3 rounded-full mb-3">
                    <i class="fa-solid fa-file-export text-orange-600 text-xl"></i>
                </div>
                <h3 class="font-semibold">Convert</h3>
                <p class="text-xs text-gray-500 mt-1">Ubah ke format PDF</p>
            </button>
        </div>

        <!-- Signature Area (Kanvas & Pengaturan Tanda Tangan) -->
        <div id="signature-area" class="w-full max-w-2xl hidden flex-col items-center mt-6">
            <h3 class="text-lg font-semibold mb-4 text-gray-700">Pengaturan Tanda Tangan:</h3>
            
            <!-- Pilihan Halaman & Posisi -->
            <div class="w-full flex flex-col md:flex-row justify-center gap-4 mb-6">
                <!-- Dropdown Halaman -->
                <div class="flex flex-col items-start w-full md:w-1/2">
                    <label class="text-sm text-gray-600 font-medium mb-1">Target Halaman (Khusus PDF):</label>
                    <select id="page-selection" onchange="toggleSpecificPage()" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        <option value="last">Halaman Terakhir Saja</option>
                        <option value="all">Semua Halaman (Untuk Paraf)</option>
                        <option value="specific">Halaman Tertentu...</option>
                    </select>
                    <input type="number" id="specific-page-input" class="hidden w-full border border-gray-300 rounded px-3 py-2 text-sm mt-2" min="1" placeholder="Masukkan Nomor Halaman (Misal: 2)">
                </div>

                <!-- Dropdown Posisi -->
                <div class="flex flex-col items-start w-full md:w-1/2">
                    <label class="text-sm text-gray-600 font-medium mb-1">Posisi Tanda Tangan:</label>
                    <select id="sig-position" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        <option value="right">Kanan Bawah</option>
                        <option value="left">Kiri Bawah</option>
                        <option value="center">Tengah Bawah</option>
                    </select>
                </div>
            </div>

            <h3 class="text-md font-semibold mb-2 text-gray-700">Silakan Coret di Bawah:</h3>
            <!-- Kanvas touch-none penting agar layar HP tidak ikut ter-scroll saat tanda tangan -->
            <canvas id="sig-canvas" width="300" height="150" class="border-2 border-dashed border-gray-400 rounded-lg bg-white shadow-inner touch-none cursor-crosshair"></canvas>
            
            <div class="mt-6 flex gap-4">
                <button onclick="clearCanvas()" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg font-medium hover:bg-red-200 transition">Hapus Ulang</button>
                <button onclick="saveAndGeneratePDF()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700 transition">Selesai & Download PDF</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4 text-sm mt-auto">
        <p>&copy; 2026 - PDF Super Easy Tool</p>
    </footer>

    <!-- JavaScript Logika UI & PDF -->
    <script>
        const fileInput = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name');
        const actionMenu = document.getElementById('action-menu');
        const dropzone = document.getElementById('dropzone');
        const signatureArea = document.getElementById('signature-area');
        
        let currentFile = null;

        // 1. Menangani Upload File
        fileInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                currentFile = e.target.files[0];
                fileNameDisplay.textContent = "File terpilih: " + currentFile.name;
                fileNameDisplay.classList.remove('hidden');
                dropzone.classList.remove('py-8');
                dropzone.classList.add('py-4');
                actionMenu.classList.remove('hidden');
                signatureArea.classList.add('hidden'); // Sembunyikan kanvas jika upload ulang
            }
        });

        // 2. Fungsi memunculkan kanvas
        function startSignProcess() {
            if(!currentFile) return alert("Pilih file terlebih dahulu!");
            
            actionMenu.classList.add('hidden');
            signatureArea.classList.remove('hidden');
            signatureArea.classList.add('flex');
            initCanvas();
        }

        // 3. Fungsi memunculkan input nomor halaman jika dipilih
        function toggleSpecificPage() {
            const select = document.getElementById('page-selection').value;
            const input = document.getElementById('specific-page-input');
            if (select === 'specific') {
                input.classList.remove('hidden');
            } else {
                input.classList.add('hidden');
            }
        }

        // 4. Logika Menggambar di Kanvas (Mouse & Touch)
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function initCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000"; // Tinta warna hitam
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            const pos = getCoordinates(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // Event Listener Mouse
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        
        // Event Listener Touch (Untuk HP)
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, {passive: false});

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 5. Logika Membuat PDF dengan pdf-lib (Mendukung PDF & Gambar, Posisi, & Halaman)
        async function saveAndGeneratePDF() {
            const { PDFDocument } = PDFLib;
            
            try {
                const fileData = await currentFile.arrayBuffer();
                let pdfDoc;

                // Load PDF atau Gambar
                if (currentFile.type === 'application/pdf') {
                    pdfDoc = await PDFDocument.load(fileData);
                } else if (currentFile.type === 'image/jpeg' || currentFile.type === 'image/png') {
                    pdfDoc = await PDFDocument.create();
                    let image = currentFile.type === 'image/jpeg' ? 
                                await pdfDoc.embedJpg(fileData) : 
                                await pdfDoc.embedPng(fileData);
                    const page = pdfDoc.addPage([image.width, image.height]);
                    page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
                } else {
                    alert("Format tidak didukung. Harap upload file JPG, PNG, atau PDF.");
                    return;
                }

                // Siapkan gambar tanda tangan dari kanvas
                const sigDataUrl = canvas.toDataURL('image/png');
                const sigBytes = await fetch(sigDataUrl).then(res => res.arrayBuffer());
                const sigImage = await pdfDoc.embedPng(sigBytes);

                const sigWidth = 200; 
                const sigHeight = 100;
                const position = document.getElementById('sig-position').value;

                // Fungsi internal untuk menempelkan gambar ke halaman tertentu
                const applySignature = (targetPage) => {
                    const { width, height } = targetPage.getSize();
                    let xPos;
                    const yPos = 50; // Jarak dari bawah

                    if (position === 'left') {
                        xPos = 50;
                    } else if (position === 'center') {
                        xPos = (width - sigWidth) / 2;
                    } else {
                        xPos = width - sigWidth - 50; // Default Kanan
                    }

                    targetPage.drawImage(sigImage, {
                        x: xPos, 
                        y: yPos, 
                        width: sigWidth, 
                        height: sigHeight,
                    });
                };

                // Eksekusi penempelan berdasarkan pilihan pengguna
                const pages = pdfDoc.getPages();
                
                if (currentFile.type === 'application/pdf') {
                    const pageSelection = document.getElementById('page-selection').value;
                    
                    if (pageSelection === 'all') {
                        // Loop ke semua halaman (Paraf)
                        pages.forEach(p => applySignature(p));
                    } else if (pageSelection === 'specific') {
                        // Halaman spesifik
                        const pageNum = parseInt(document.getElementById('specific-page-input').value);
                        if (pageNum > 0 && pageNum <= pages.length) {
                            applySignature(pages[pageNum - 1]);
                        } else {
                            alert("Nomor halaman tidak valid atau melebihi jumlah halaman dokumen!");
                            return;
                        }
                    } else {
                        // Default: Halaman terakhir
                        applySignature(pages[pages.length - 1]);
                    }
                } else {
                    // Jika file sumber adalah gambar, cukup tempel di halaman tunggal tersebut
                    applySignature(pages[0]);
                }

                // Simpan dan Download
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                
                // Hapus ekstensi lama, ganti jadi .pdf
                const originalName = currentFile.name.split('.').slice(0, -1).join('.');
                link.download = "Signed_" + originalName + ".pdf";
                
                link.click();
                alert("Berhasil! File PDF Anda sedang diunduh.");
                
            } catch (error) {
                console.error("Error generating PDF:", error);
                alert("Terjadi kesalahan saat memproses file. Pastikan file tidak dikunci (password).");
            }
        }
    </script>
</body>
</html>
