<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Super Easy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF-Lib untuk manipulasi PDF -->
    <script src="https://unpkg.com/pdf-lib"></script>
    <!-- PDF.js untuk Render/Preview PDF di Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        #pdf-render-container {
            position: relative;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #draggable-sig {
            position: absolute;
            top: 50px;
            left: 50px;
            cursor: move;
            border: 1px dashed blue;
            background-color: rgba(255, 255, 255, 0.3);
            touch-action: none;
            width: 150px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold"><i class="fa-solid fa-file-pdf mr-2"></i>PDF Super Easy</h1>
        <p class="text-sm opacity-80 mt-1">Sign & Auto Paraf Bebas di Mana Pun</p>
    </header>

    <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
        
        <!-- STEP 1: Upload Area -->
        <div id="step-1" class="w-full max-w-2xl bg-white border-2 border-dashed border-blue-300 rounded-xl p-8 text-center hover:bg-blue-50 transition mb-6">
            <i class="fa-solid fa-cloud-arrow-up text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-xl font-semibold mb-2">1. Upload Dokumen</h2>
            <p class="text-gray-500 text-sm mb-4">Pilih file PDF atau Gambar (JPG/PNG)</p>
            <input type="file" id="file-upload" class="hidden" accept="image/png, image/jpeg, .pdf" />
            <button onclick="document.getElementById('file-upload').click()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Pilih File</button>
            <p id="file-name" class="mt-4 text-sm font-semibold text-green-600 hidden"></p>
        </div>

        <!-- STEP 2: Kanvas Tanda Tangan -->
        <div id="step-2" class="w-full max-w-2xl hidden flex-col items-center mb-6 bg-white p-6 rounded-xl shadow border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">2. Buat Tanda Tangan / Paraf</h2>
            <canvas id="sig-canvas" width="300" height="150" class="border-2 border-dashed border-gray-400 rounded-lg bg-gray-50 touch-none cursor-crosshair"></canvas>
            <div class="mt-4 flex gap-4">
                <button onclick="clearCanvas()" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg font-medium hover:bg-red-200 transition">Hapus Ulang</button>
                <button onclick="preparePreview()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Lanjut ke Preview <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </div>
            <!-- Tombol Batal -->
            <button onclick="resetApp()" class="mt-4 text-sm text-gray-400 hover:text-gray-600 underline">Batal & Pilih File Lain</button>
        </div>

        <!-- STEP 3: Preview PDF & Drag Tanda Tangan -->
        <div id="step-3" class="w-full hidden flex-col items-center mb-6">
            <div class="bg-white p-4 rounded-xl shadow border border-gray-200 w-full max-w-4xl flex flex-col items-center">
                <h2 class="text-xl font-semibold mb-2">3. Posisikan Tanda Tangan</h2>
                <p class="text-sm text-gray-500 mb-4 text-center">Geser kotak tanda tangan ke posisi yang Anda inginkan pada dokumen.</p>
                
                <div class="flex items-center gap-2 mb-4">
                    <label class="text-sm font-medium">Preview Halaman ke:</label>
                    <input type="number" id="page-number" class="border rounded w-16 text-center py-1" value="1" min="1" onchange="renderPDFPage(this.value)">
                    <span id="page-count" class="text-sm text-gray-500">dari -</span>
                </div>

                <!-- Area Preview -->
                <div id="pdf-render-container" class="overflow-hidden border border-gray-300">
                    <canvas id="pdf-canvas"></canvas>
                    <img id="draggable-sig" src="" alt="Signature" draggable="false">
                </div>

                <!-- Opsi Auto Paraf Fleksibel -->
                <div class="mt-6 w-full max-w-md bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <div class="flex items-center">
                        <input type="checkbox" id="apply-all-pages" class="w-5 h-5 text-blue-600 rounded cursor-pointer" onchange="toggleAutoParaf()">
                        <label for="apply-all-pages" class="ml-3 text-sm font-semibold text-blue-800 cursor-pointer">Auto Paraf (Terapkan ke banyak halaman)</label>
                    </div>
                    
                    <!-- Pilihan rentang halaman -->
                    <div id="auto-paraf-options" class="hidden items-center mt-3 text-sm pl-8 flex-wrap gap-2">
                        <label class="font-medium text-blue-800">Dari hal:</label>
                        <input type="number" id="start-page-input" class="border border-blue-300 rounded w-16 text-center py-1" value="2" min="1">
                        <label class="font-medium text-blue-800">sampai hal:</label>
                        <input type="number" id="end-page-input" class="border border-blue-300 rounded w-16 text-center py-1" min="1">
                    </div>
                </div>

                <!-- Tombol Action -->
                <div class="mt-6 flex flex-col md:flex-row gap-4 w-full max-w-md">
                    <button onclick="resetApp()" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-300 transition w-full md:w-1/3">
                        <i class="fa-solid fa-rotate-left mr-2"></i> File Lain
                    </button>
                    <button onclick="generateFinalPDF()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-700 transition shadow-lg w-full md:w-2/3">
                        <i class="fa-solid fa-download mr-2"></i> Download PDF
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-gray-800 text-white text-center p-4 text-sm mt-auto">
        <p>&copy; 2026 - PDF Super Easy Tool</p>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let currentFile = null;
        let pdfBytesMemory = null; 
        let pdfjsDocument = null; 
        let currentPdfPage = 1;
        let renderedScale = 1; 

        // --- FUNGSI RESET APP (Mulai dari awal) ---
        function resetApp() {
            // Reset Variabel
            currentFile = null;
            pdfBytesMemory = null; 
            pdfjsDocument = null; 
            currentPdfPage = 1;
            renderedScale = 1;

            // Reset File Input
            document.getElementById('file-upload').value = '';
            document.getElementById('file-name').classList.add('hidden');
            document.getElementById('file-name').textContent = '';

            // Reset UI Steps
            document.getElementById('step-3').classList.add('hidden');
            document.getElementById('step-3').classList.remove('flex');
            
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-2').classList.remove('flex');
            
            document.getElementById('step-1').classList.remove('hidden');

            // Reset Checkbox & Options
            document.getElementById('apply-all-pages').checked = false;
            toggleAutoParaf();

            // Bersihkan kanvas
            clearCanvas();
        }

        document.getElementById('file-upload').addEventListener('change', async function(e) {
            if(e.target.files.length > 0) {
                currentFile = e.target.files[0];
                document.getElementById('file-name').textContent = "File terpilih: " + currentFile.name;
                document.getElementById('file-name').classList.remove('hidden');
                
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                document.getElementById('step-2').classList.add('flex');
                initCanvas();
            }
        });

        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function initCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000"; 
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startPosition(e) { isDrawing = true; draw(e); }
        function endPosition() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            const pos = getCoordinates(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition, {passive: false});
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, {passive: false});

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        async function preparePreview() {
            try {
                const sigDataUrl = canvas.toDataURL('image/png');
                const sigImgEl = document.getElementById('draggable-sig');
                sigImgEl.src = sigDataUrl;

                const { PDFDocument } = PDFLib;
                const fileData = await currentFile.arrayBuffer();

                if (currentFile.type === 'application/pdf') {
                    pdfBytesMemory = new Uint8Array(fileData);
                } else if (currentFile.type === 'image/jpeg' || currentFile.type === 'image/png') {
                    const tempPdf = await PDFDocument.create();
                    let image = currentFile.type === 'image/jpeg' ? await tempPdf.embedJpg(fileData) : await tempPdf.embedPng(fileData);
                    const page = tempPdf.addPage([image.width, image.height]);
                    page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
                    pdfBytesMemory = await tempPdf.save();
                }

                const loadingTask = pdfjsLib.getDocument({ data: pdfBytesMemory });
                pdfjsDocument = await loadingTask.promise;
                
                document.getElementById('page-count').textContent = "dari " + pdfjsDocument.numPages;
                document.getElementById('page-number').max = pdfjsDocument.numPages;
                
                document.getElementById('start-page-input').max = pdfjsDocument.numPages;
                document.getElementById('end-page-input').max = pdfjsDocument.numPages;
                document.getElementById('end-page-input').value = pdfjsDocument.numPages;
                
                await renderPDFPage(1); 

                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('step-3').classList.remove('hidden');
                document.getElementById('step-3').classList.add('flex');
            } catch (err) {
                alert("Gagal memuat dokumen. Pastikan file tidak rusak.");
                console.error(err);
            }
        }

        async function renderPDFPage(pageNum) {
            pageNum = parseInt(pageNum);
            if(pageNum < 1 || pageNum > pdfjsDocument.numPages) return;
            currentPdfPage = pageNum;

            const page = await pdfjsDocument.getPage(pageNum);
            const pdfCanvas = document.getElementById('pdf-canvas');
            const pdfCtx = pdfCanvas.getContext('2d');

            const unscaledViewport = page.getViewport({ scale: 1 });
            const containerWidth = Math.min(window.innerWidth - 40, 800);
            renderedScale = containerWidth / unscaledViewport.width;
            
            const viewport = page.getViewport({ scale: renderedScale });
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;

            const renderContext = { canvasContext: pdfCtx, viewport: viewport };
            await page.render(renderContext).promise;

            const sigImg = document.getElementById('draggable-sig');
            sigImg.style.left = (viewport.width / 2 - 75) + 'px';
            sigImg.style.top = (viewport.height / 2 - 37) + 'px';
        }

        const sigEl = document.getElementById('draggable-sig');
        const containerEl = document.getElementById('pdf-render-container');
        let isDraggingSig = false;
        let startX, startY, initialLeft, initialTop;

        function dragStart(e) {
            isDraggingSig = true;
            const event = e.touches ? e.touches[0] : e;
            startX = event.clientX;
            startY = event.clientY;
            initialLeft = parseInt(sigEl.style.left || 0);
            initialTop = parseInt(sigEl.style.top || 0);
        }

        function dragMove(e) {
            if (!isDraggingSig) return;
            e.preventDefault(); 
            const event = e.touches ? e.touches[0] : e;
            
            let deltaX = event.clientX - startX;
            let deltaY = event.clientY - startY;
            
            let newLeft = initialLeft + deltaX;
            let newTop = initialTop + deltaY;

            const maxLeft = containerEl.clientWidth - sigEl.clientWidth;
            const maxTop = containerEl.clientHeight - sigEl.clientHeight;
            
            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));

            sigEl.style.left = newLeft + 'px';
            sigEl.style.top = newTop + 'px';
        }

        function dragEnd() { isDraggingSig = false; }

        sigEl.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);
        sigEl.addEventListener('touchstart', dragStart, {passive: false});
        window.addEventListener('touchmove', dragMove, {passive: false});
        window.addEventListener('touchend', dragEnd);

        function toggleAutoParaf() {
            const checkbox = document.getElementById('apply-all-pages');
            const options = document.getElementById('auto-paraf-options');
            if (checkbox.checked) {
                options.classList.remove('hidden');
                options.classList.add('flex');
            } else {
                options.classList.add('hidden');
                options.classList.remove('flex');
            }
        }

        async function generateFinalPDF() {
            try {
                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(pdfBytesMemory);
                const pages = pdfDoc.getPages();
                
                const targetPage = pages[currentPdfPage - 1]; 
                const { width: originalPdfWidth, height: originalPdfHeight } = targetPage.getSize();
                
                const cssLeft = parseFloat(sigEl.style.left);
                const cssTop = parseFloat(sigEl.style.top);
                const cssWidth = sigEl.clientWidth;
                const cssHeight = sigEl.clientHeight;

                const realX = cssLeft / renderedScale;
                const realYTop = cssTop / renderedScale;
                const realWidth = cssWidth / renderedScale;
                const realHeight = cssHeight / renderedScale;
                const realYBottom = originalPdfHeight - realYTop - realHeight;

                const sigDataUrl = canvas.toDataURL('image/png');
                const sigBytes = await fetch(sigDataUrl).then(res => res.arrayBuffer());
                const sigImage = await pdfDoc.embedPng(sigBytes);

                const applyToAll = document.getElementById('apply-all-pages').checked;

                if (applyToAll) {
                    let startPageStr = document.getElementById('start-page-input').value;
                    let endPageStr = document.getElementById('end-page-input').value;
                    
                    let startPageIndex = parseInt(startPageStr) - 1;
                    let endPageIndex = parseInt(endPageStr) - 1;
                    
                    if (isNaN(startPageIndex) || startPageIndex < 0) startPageIndex = 0;
                    if (isNaN(endPageIndex) || endPageIndex >= pages.length) endPageIndex = pages.length - 1;
                    if (endPageIndex < startPageIndex) endPageIndex = startPageIndex;

                    for (let i = startPageIndex; i <= endPageIndex; i++) {
                        const p = pages[i];
                        const { height: pHeight } = p.getSize();
                        p.drawImage(sigImage, {
                            x: realX,
                            y: pHeight - realYTop - realHeight, 
                            width: realWidth,
                            height: realHeight,
                        });
                    }
                } else {
                    targetPage.drawImage(sigImage, {
                        x: realX,
                        y: realYBottom,
                        width: realWidth,
                        height: realHeight,
                    });
                }

                const finalPdfBytes = await pdfDoc.save();
                const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                
                const originalName = currentFile.name.split('.').slice(0, -1).join('.');
                link.download = "Signed_Custom_" + originalName + ".pdf";
                link.click();
                
                alert("Berhasil! PDF telah diunduh.");
                
            } catch (err) {
                console.error(err);
                alert("Gagal memproses dokumen.");
            }
        }
    </script>
</body>
</html>
